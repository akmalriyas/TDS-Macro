<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flare Macro - Setup & Verification</title>
<style>
@font-face{font-family:"Chakra Petch";font-weight:600;src:url(fonts/chakra-600.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:700;src:url(fonts/chakra-700.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url(fonts/jbm-400.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(fonts/jbm-700.woff2) format("woff2")}

:root{
  --bg:#07080b; --bg2:#0b0d13; --card:#0e1017; --card-hi:#141722;
  --line:#222530; --line2:#2f3445; --line-hi:rgba(242,17,61,.55);
  --text:#f3f3f6; --muted:#8a8d9a; --dim:#525562;
  --accent:#f2113d; --accent-soft:rgba(242,17,61,.14); --accent-line:rgba(242,17,61,.4);
  --ok:#2fe08a; --warn:#f5b301;
  --head:"Chakra Petch","Segoe UI",sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:var(--mono);font-size:12px;color:var(--text);user-select:none;
}

.window{
  width:100%;height:100%;display:flex;flex-direction:column;
  border:1px solid var(--line-hi);background:var(--bg);
  box-shadow:0 0 32px rgba(242,17,61,0.18) inset, 0 8px 32px rgba(0,0,0,0.8);
}

.titlebar{
  height:38px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);background:var(--bg2);flex:none;
}
.pywebview-drag-region{cursor:grab}

.brand{display:flex;align-items:center;gap:8px}
.brand-name{font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--accent)}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.06em}

.wc{display:flex;align-items:center;gap:6px}
.wc-btn{
  width:26px;height:22px;border:none;background:transparent;color:var(--muted);
  border-radius:3px;display:grid;place-items:center;cursor:pointer;transition:all .15s;
}
.wc-btn:hover{background:var(--line2);color:#fff}
.wc-btn.close:hover{background:var(--accent);color:#fff}

.content{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

.hero{
  padding:14px 18px;background:var(--card);border:1px solid var(--line);
  border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.hero-text b{font-family:var(--head);font-size:13.5px;letter-spacing:.04em;display:block}
.hero-text span{font-size:11px;color:var(--muted);margin-top:2px;display:block}

.checklist{display:flex;flex-direction:column;gap:8px}
.check-item{
  padding:10px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:all .15s ease;
}
.check-item:hover{background:var(--card-hi);border-color:var(--line2)}
.check-item-main{display:flex;align-items:center;gap:12px;min-width:0}
.check-dot{width:8px;height:8px;border-radius:50%;flex:none}
.check-dot.pass{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.check-dot.fail{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.check-dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.check-text b{font-family:var(--head);font-size:12px;letter-spacing:.04em;display:block}
.check-text span{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check-actions{display:flex;align-items:center;gap:8px;flex:none;flex-shrink:0}

.badge{
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;
  padding:3px 8px;border-radius:3px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.badge.pass{background:rgba(47,224,138,.12);color:var(--ok);border:1px solid rgba(47,224,138,.35)}
.badge.fail{background:rgba(242,17,61,.14);color:var(--accent);border:1px solid var(--accent-line)}
.badge.warn{background:rgba(245,179,1,.12);color:var(--warn);border:1px solid rgba(245,179,1,.35)}

.btn{
  font-family:var(--head);font-weight:700;font-size:11px;letter-spacing:.06em;
  padding:7px 15px;border:1px solid var(--line2);border-radius:4px;
  background:var(--card-hi);color:var(--text);cursor:pointer;transition:all .15s ease;
  white-space:nowrap;flex-shrink:0;
}
.btn:hover:not(:disabled){border-color:var(--text);color:#fff}
.btn.primary{
  background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 0 14px rgba(242,17,61,.35);
}
.btn.primary:hover:not(:disabled){background:#ff2452;box-shadow:0 0 20px rgba(242,17,61,.6)}
.btn.xs{padding:3px 9px;font-size:9.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

.footer{
  padding:14px 22px;border-top:1px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;
}
.foot-note{font-size:10.5px;color:var(--muted);line-height:1.35;max-width:320px}

.toast{
  position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(14,16,23,0.96);border:1px solid var(--line-hi);
  padding:8px 18px;border-radius:4px;font-size:11px;color:#fff;
  opacity:0;pointer-events:none;transition:all .2s ease;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-flare" viewBox="0 0 32 32">
      <defs>
        <linearGradient id="flare-g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff3366"/>
          <stop offset="60%" stop-color="#f2113d"/>
          <stop offset="100%" stop-color="#800014"/>
        </linearGradient>
      </defs>
      <polygon points="16,2 21,13 18,16 20,25 16,30 12,25 14,16 11,13" fill="url(#flare-g)"/>
    </symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2"/></symbol>
  </defs>
</svg>

<div class="window">
  <header class="titlebar pywebview-drag-region">
    <div class="brand">
      <svg style="width:16px;height:16px;filter:drop-shadow(0 0 4px rgba(242,17,61,.8));flex:none" viewBox="0 0 32 32"><use href="#i-flare"/></svg>
      <span class="brand-name">FLARE MACRO</span>
      <span class="brand-sub">// SETUP &amp; VERIFICATION</span>
    </div>
    <div class="wc">
      <button class="wc-btn" id="wc-min" aria-label="Minimize"><svg style="width:12px;height:12px" viewBox="0 0 24 24"><use href="#i-min"/></svg></button>
      <button class="wc-btn close" id="wc-close" aria-label="Close"><svg style="width:12px;height:12px" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
    </div>
  </header>

  <div class="content">
    <div class="hero">
      <div class="hero-text">
        <b id="hero-title">ENVIRONMENT VERIFICATION</b>
        <span id="hero-sub">Validating system prerequisites and client readiness before launch</span>
      </div>
      <button type="button" class="btn" id="btn-rescan">RE-SCAN</button>
    </div>

    <div class="checklist" id="checklist">
      <div style="padding:32px;text-align:center;color:var(--muted)">Scanning environment...</div>
    </div>
  </div>

  <footer class="footer">
    <span class="foot-note" id="foot-note">All critical prerequisites must pass before starting the macro</span>
    <button type="button" class="btn primary" id="btn-launch" disabled>COMPLETE SETUP &amp; LAUNCH</button>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

const esc = (s) => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

async function scan() {
  const heroTitle = $("#hero-title");
  const heroSub = $("#hero-sub");
  const listEl = $("#checklist");
  const launchBtn = $("#btn-launch");

  heroTitle.textContent = "SCANNING ENVIRONMENT...";
  heroTitle.style.color = "";
  heroSub.textContent = "Testing Windows components, OCR capability, display scaling, and capture pipeline";
  launchBtn.disabled = true;

  try {
    const res = await window.pywebview.api.check_requirements();
    const checks = res.checks || [];

    if (res.critical_passed) {
      heroTitle.textContent = "ENVIRONMENT READY";
      heroTitle.style.color = "var(--ok)";
      heroSub.textContent = "All critical system prerequisites verified successfully.";
      launchBtn.disabled = false;
    } else {
      heroTitle.textContent = "ACTION REQUIRED";
      heroTitle.style.color = "var(--accent)";
      heroSub.textContent = "One or more critical prerequisites must be resolved before proceeding.";
      launchBtn.disabled = true;
    }

    listEl.innerHTML = checks.map((c) => {
      const dotCls = c.passed ? "pass" : (c.critical ? "fail" : "warn");
      const badgeCls = c.passed ? "pass" : (c.critical ? "fail" : "warn");
      const fixBtn = c.fix_action ? `<button type="button" class="btn xs primary" data-fix="${c.fix_action}">${esc(c.fix_label || "Fix")}</button>` : "";
      return `
        <div class="check-item">
          <div class="check-item-main">
            <i class="check-dot ${dotCls}"></i>
            <div class="check-text">
              <b>${esc(c.name)}</b>
              <span>${esc(c.detail)}</span>
            </div>
          </div>
          <div class="check-actions">
            ${fixBtn}
            <span class="badge ${badgeCls}">${esc(c.status)}</span>
          </div>
        </div>
      `;
    }).join("");
  } catch (e) {
    heroTitle.textContent = "DIAGNOSTIC ERROR";
    heroSub.textContent = String(e);
  }
}

$("#btn-rescan").addEventListener("click", scan);
$("#checklist").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-fix]");
  if (!btn) return;
  const action = btn.dataset.fix;
  btn.disabled = true;
  btn.textContent = "Working...";
  const r = await window.pywebview.api.fix_requirement(action);
  toast(r.message || "Action executed");
  setTimeout(scan, 2500);
});

$("#btn-launch").addEventListener("click", () => {
  toast("Launching Flare Macro...");
  setTimeout(() => window.pywebview.api.complete_and_launch(), 400);
});

$("#wc-min").addEventListener("click", () => window.pywebview.api.win_minimize());
$("#wc-close").addEventListener("click", () => window.pywebview.api.win_close());

window.addEventListener("pywebviewready", () => {
  scan();
});
</script>
</body>
</html>
