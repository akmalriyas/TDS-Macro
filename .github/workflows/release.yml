name: Release Flare Macro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.3)'
        required: true
        default: '1.0.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean flare.spec
          if (Test-Path "FlareMacro.exe.config") {
            Copy-Item "FlareMacro.exe.config" "dist/FlareMacro/FlareMacro.exe.config" -Force
          }

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path dist/FlareMacro/* -DestinationPath dist/FlareMacro-Portable.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Inno Setup Installer
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            throw "ISCC compiler not found"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FlareMacro-Portable.zip
            Output/FlareSetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
